<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/style.root.css">
    <link rel="stylesheet" href="/assets/css/style.header.css">
    <link rel="stylesheet" href="/assets/css/style.details.css">
    <link rel="stylesheet" href="/assets/css/style.global.css">
    <link rel="stylesheet" href="/assets/css/style.modal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Détails du Jeu - GameHub</title>
    <style>
        .detail-cover {
            width: 150px;
            height: 200px;
            object-fit: cover;
            border-radius: var(--border-radius);
        }
        .screenshot {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: var(--border-radius);
            margin: 5px;
        }
        .screenshots {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
        }
        .detail-header {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }
        .info-label {
            font-weight: bold;
            color: var(--accent-color);
        }
        .info-value {
            color: var(--text-color);
        }
        @media (max-width: 768px) {
            .detail-header {
                flex-direction: column;
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1><i class="fas fa-gamepad"></i> GameHub</h1>
        <nav>
            <ul>
                <li><a href="/"><i class="fas fa-home"></i> Accueil</a></li>
                <li><a href="/listegames.html"><i class="fas fa-gamepad"></i> Jeux</a></li>
                <li><a href="/listestudio.html"><i class="fas fa-building"></i> Studios</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div id="details" class="card">
            <div class="detail-header">
                <img id="gameImage" src="" class="detail-cover" alt="Couverture du jeu">
                <div>
                    <h2 id="gameTitle" style="margin: 0;"></h2>
                    <div id="gameBadges" style="display: flex; gap: 10px; margin: 10px 0;"></div>
                </div>
            </div>

            <div class="info-grid">
                <div>
                    <img id="gameCover" src="" alt="Couverture du jeu" style="width: 100%; max-height: 300px; object-fit: cover; border-radius: var(--border-radius); margin-bottom: 20px;">
                </div>

                <div>
                    <div class="info-label">Date de sortie:</div>
                    <div class="info-value" id="gameReleaseDate"></div>

                    <div class="info-label">Plateformes:</div>
                    <div class="info-value" id="gamePlatform"></div>

                    <div class="info-label">Développeur:</div>
                    <div class="info-value" id="gameDeveloper"></div>

                    <div class="info-label">Genre:</div>
                    <div class="info-value" id="gameGenre"></div>
                </div>
            </div>

            <div>
                <h3 style="margin: 20px 0 10px; color: var(--accent-color);">Description</h3>
                <p id="gameDescription" style="line-height: 1.6; margin-bottom: 20px;"></p>
            </div>

            <div>
                <h3 style="margin: 20px 0 10px; color: var(--accent-color);">Captures d'écran</h3>
                <div id="gameScreenshots" class="screenshots">
                    <!-- Les screenshots seront ajoutés ici -->
                </div>
            </div>

            <div style="display: flex; justify-content: center; gap: 15px; margin-top: 30px;">
                <button id="editGameBtn" class="btn"><i class="fas fa-edit"></i> Modifier</button>
                <button id="deleteGameBtn" class="btn btn-danger"><i class="fas fa-trash"></i> Supprimer</button>
            </div>
        </div>
    </main>

    <!-- Modal pour modifier un jeu -->
    <div id="editGameModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2><i class="fas fa-edit"></i> Modifier un jeu</h2>
            <form id="editGameForm">
                <input type="hidden" id="editId" name="id">
                <label for="editTitle">Titre :</label>
                <input type="text" id="editTitle" name="title" required>
                <label for="editGenre">Genre :</label>
                <input type="text" id="editGenre" name="genre" required>
                <label for="editReleaseDate">Date de sortie :</label>
                <input type="date" id="editReleaseDate" name="releaseDate" required>
                <label for="editDeveloper">Développeur :</label>
                <input type="text" id="editDeveloper" name="developer" required>
                <label for="editPlatform">Plateforme :</label>
                <input type="text" id="editPlatform" name="platform" required>
                <label for="editImageUrl">URL de l'image :</label>
                <input type="text" id="editImageUrl" name="imageUrl" placeholder="https://exemple.com/image.jpg">
                <label for="editDescription">Description :</label>
                <textarea id="editDescription" name="description" rows="4"></textarea>
                <button type="submit"><i class="fas fa-save"></i> Enregistrer</button>
            </form>
        </div>
    </div>

    <!-- Modal pour supprimer un jeu -->
    <div id="deleteGameModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2><i class="fas fa-exclamation-triangle"></i> Supprimer un jeu</h2>
            <p>Êtes-vous sûr de vouloir supprimer ce jeu ?</p>
            <button type="button" id="confirmDeleteBtn"><i class="fas fa-trash"></i> Supprimer</button>
            <button type="button" id="cancelDeleteBtn"><i class="fas fa-ban"></i> Annuler</button>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <!-- Script -->
    <script type="module" src="/assets/scripts/gameDetails.js"></script>
</body>
</html>
