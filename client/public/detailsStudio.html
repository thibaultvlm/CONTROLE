<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/style.root.css">
    <link rel="stylesheet" href="/assets/css/style.header.css">
    <link rel="stylesheet" href="/assets/css/style.details.css">
    <link rel="stylesheet" href="/assets/css/style.global.css">
    <link rel="stylesheet" href="/assets/css/style.modal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Détails du Studio - GameHub</title>
    <style>
        .studio-logo {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
        }
        .detail-header {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            align-items: center;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }
        .info-label {
            font-weight: bold;
            color: var(--purple-accent);
        }
        .info-value {
            color: var(--text-color);
        }
        @media (max-width: 768px) {
            .detail-header {
                flex-direction: column;
                text-align: center;
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1><i class="fas fa-film"></i> Détails du studio</h1>
        <nav>
            <ul>
                <li><a href="/"><i class="fas fa-home"></i> Accueil</a></li>
                <li><a href="/listegames.html"><i class="fas fa-gamepad"></i> Jeux</a></li>
                <li><a href="/listestudio.html"><i class="fas fa-building"></i> Studios</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div id="details" class="card">
            <div class="detail-header">
                <img id="studioImage" src="" class="studio-logo" alt="Logo du studio">
                <div>
                    <h2 id="studioName" style="margin: 0;"></h2>
                    <div style="display: flex; gap: 10px; margin: 10px 0;">
                        <span class="badge" style="background-color: var(--purple-accent);" id="studioLocationBadge"></span>
                    </div>
                </div>
            </div>

            <div class="info-grid">
                <div>
                    <img id="studioCover" src="" alt="Couverture du studio" style="width: 100%; max-height: 300px; object-fit: cover; border-radius: var(--border-radius); margin-bottom: 20px;">
                </div>

                <div>
                    <div class="info-label">Fondé le:</div>
                    <div class="info-value" id="studioFounded"></div>

                    <div class="info-label">Fondateur:</div>
                    <div class="info-value" id="studioFounder"></div>

                    <div class="info-label">Employés:</div>
                    <div class="info-value" id="studioEmployees"></div>
                </div>
            </div>

            <div>
                <h3 style="margin: 20px 0 10px; color: var(--purple-accent);">Jeux développés</h3>
                <div id="studioGames" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px;">
                    <!-- Les jeux du studio seront affichés ici -->
                </div>
            </div>

            <div style="display: flex; justify-content: center; gap: 15px; margin-top: 30px;">
                <button id="editStudioBtn" class="btn"><i class="fas fa-edit"></i> Modifier</button>
                <button id="deleteStudioBtn" class="btn btn-danger"><i class="fas fa-trash"></i> Supprimer</button>
            </div>
        </div>
    </main>

    <!-- Modal pour modifier un studio -->
    <div id="editStudioModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2><i class="fas fa-edit"></i> Modifier un studio</h2>
            <form id="editStudioForm">
                <input type="hidden" id="editId" name="id">
                <label for="editName">Nom :</label>
                <input type="text" id="editName" name="name" required>
                <label for="editLocation">Localisation :</label>
                <input type="text" id="editLocation" name="location" required>
                <label for="editFounded">Fondé le :</label>
                <input type="date" id="editFounded" name="founded" required>
                <label for="editFounder">Fondateur :</label>
                <input type="text" id="editFounder" name="founder" required>
                <label for="editEmployees">Employés :</label>
                <input type="number" id="editEmployees" name="employees" required>
                <label for="editImageUrl">URL de l'image :</label>
                <input type="text" id="editImageUrl" name="imageUrl" placeholder="https://exemple.com/image.jpg">
                <button type="submit"><i class="fas fa-save"></i> Enregistrer</button>
            </form>
        </div>
    </div>

    <!-- Modal pour supprimer un studio -->
    <div id="deleteStudioModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2><i class="fas fa-exclamation-triangle"></i> Supprimer un studio</h2>
            <p>Êtes-vous sûr de vouloir supprimer ce studio ?</p>
            <button type="button" id="confirmDeleteBtn"><i class="fas fa-trash"></i> Supprimer</button>
            <button type="button" id="cancelDeleteBtn"><i class="fas fa-ban"></i> Annuler</button>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <!-- Script -->
    <script type="module" src="/assets/scripts/studioDetails.js"></script>
</body>
</html>
