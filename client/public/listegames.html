<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/style.root.css">
    <link rel="stylesheet" href="/assets/css/style.header.css">
    <link rel="stylesheet" href="/assets/css/style.index.css">
    <link rel="stylesheet" href="/assets/css/style.modal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script type="module" src="/assets/scripts/gameListe.js"></script>
    <title>Liste des jeux</title>
</head>
<body>
    <header>
        <h1>Bienvenue</h1>
        <ul>
            <li><a href="/">Accueil</a></li>
            <li><a href="/listegame.html">Liste des jeux</a></li>
            <li><a href="/listestudio.html">Liste des studios</a></li>
        </ul>
    </header>
    <div id="liste">
        <h2>Liste des jeux vidéo</h2>
        <button id="addGameBtn" class="btn-add">Ajouter un jeu</button>
    </div>
    <div class="row">
        <div class="col">
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Titre</th>
                        <th scope="col">Genre</th>
                        <th scope="col">Date de sortie</th>
                        <th scope="col">Développeur</th>
                        <th scope="col">Plateforme</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody id="gameListe">
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal pour ajouter un jeu -->
    <div id="addGameModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Ajouter un jeu</h2>
            <form id="addGameForm">
                <label for="title">Titre :</label>
                <input type="text" id="title" name="title" required>
                <label for="genre">Genre :</label>
                <input type="text" id="genre" name="genre" required>
                <label for="releaseDate">Date de sortie :</label>
                <input type="date" id="releaseDate" name="releaseDate" required>
                <label for="developer">Développeur :</label>
                <input type="text" id="developer" name="developer" required>
                <label for="platform">Plateforme :</label>
                <input type="text" id="platform" name="platform" required>
                <button type="submit">Ajouter</button>
            </form>
        </div>
    </div>

    <!-- Modal pour modifier un jeu -->
    <div id="editGameModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Modifier un jeu</h2>
            <form id="editGameForm">
                <input type="hidden" id="editId" name="id">
                <label for="editTitle">Titre :</label>
                <input type="text" id="editTitle" name="title" required>
                <label for="editGenre">Genre :</label>
                <input type="text" id="editGenre" name="genre" required>
                <label for="editReleaseDate">Date de sortie :</label>
                <input type="date" id="editReleaseDate" name="releaseDate" required>
                <label for="editDeveloper">Développeur :</label>
                <input type="text" id="editDeveloper" name="developer" required>
                <label for="editPlatform">Plateforme :</label>
                <input type="text" id="editPlatform" name="platform" required>
                <button type="submit">Modifier</button>
            </form>
        </div>
    </div>

    <!-- Modal pour supprimer un jeu -->
    <div id="deleteGameModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Supprimer un jeu</h2>
            <p>Êtes-vous sûr de vouloir supprimer ce jeu ?</p>
            <button id="confirmDeleteBtn">Supprimer</button>
            <button id="cancelDeleteBtn">Annuler</button>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>
</body>
</html>
