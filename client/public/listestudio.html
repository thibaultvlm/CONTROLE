<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/style.root.css">
    <link rel="stylesheet" href="/assets/css/style.header.css">
    <link rel="stylesheet" href="/assets/css/style.index.css">
    <link rel="stylesheet" href="/assets/css/style.modal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script type="module" src="/assets/scripts/studioListe.js"></script>
    <title>Liste des studios</title>
</head>
<body>
    <header>
        <h1>Bienvenue</h1>
        <ul>
            <li><a href="/">Accueil</a></li>
            <li><a href="/listegame.html">Liste des jeux</a></li>
            <li><a href="/listestudio.html">Liste des studios</a></li>
        </ul>
    </header>
    <div id="liste">
        <h2>Liste des studios</h2>
        <button id="addStudioBtn" class="btn-add">Ajouter un studio</button>
    </div>
    <div class="row">
        <div class="col">
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Nom</th>
                        <th scope="col">Localisation</th>
                        <th scope="col">Fondé le</th>
                        <th scope="col">Fondateur</th>
                        <th scope="col">Employés</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody id="studioListe">
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal pour ajouter un studio -->
    <div id="addStudioModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Ajouter un studio</h2>
            <form id="addStudioForm">
                <label for="name">Nom :</label>
                <input type="text" id="name" name="name" required>
                <label for="location">Localisation :</label>
                <input type="text" id="location" name="location" required>
                <label for="founded">Fondé le :</label>
                <input type="date" id="founded" name="founded" required>
                <label for="founder">Fondateur :</label>
                <input type="text" id="founder" name="founder" required>
                <label for="employees">Employés :</label>
                <input type="number" id="employees" name="employees" required>
                <button type="submit">Ajouter</button>
            </form>
        </div>
    </div>

    <!-- Modal pour modifier un studio -->
    <div id="editStudioModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Modifier un studio</h2>
            <form id="editStudioForm">
                <input type="hidden" id="editId" name="id">
                <label for="editName">Nom :</label>
                <input type="text" id="editName" name="name" required>
                <label for="editLocation">Localisation :</label>
                <input type="text" id="editLocation" name="location" required>
                <label for="editFounded">Fondé le :</label>
                <input type="date" id="editFounded" name="founded" required>
                <label for="editFounder">Fondateur :</label>
                <input type="text" id="editFounder" name="founder" required>
                <label for="editEmployees">Employés :</label>
                <input type="number" id="editEmployees" name="employees" required>
                <button type="submit">Modifier</button>
            </form>
        </div>
    </div>

    <!-- Modal pour supprimer un studio -->
    <div id="deleteStudioModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Supprimer un studio</h2>
            <p>Êtes-vous sûr de vouloir supprimer ce studio ?</p>
            <button id="confirmDeleteBtn">Supprimer</button>
            <button id="cancelDeleteBtn">Annuler</button>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>
</body>
</html>
