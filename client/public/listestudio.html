<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/style.root.css">
    <link rel="stylesheet" href="/assets/css/style.header.css">
    <link rel="stylesheet" href="/assets/css/style.table.css">
    <link rel="stylesheet" href="/assets/css/style.global.css">
    <link rel="stylesheet" href="/assets/css/style.modal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Liste des Studios - GameHub</title>
    <style>
        .table img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>
    <header>
        <h1><i class="fas fa-building"></i> GameHub</h1>
        <nav>
            <ul>
                <li><a href="/"><i class="fas fa-home"></i> Accueil</a></li>
                <li><a href="/listegames.html"><i class="fas fa-gamepad"></i> Jeux</a></li>
                <li><a href="/listestudio.html"><i class="fas fa-building"></i> Studios</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="table-container">
            <h2>
                Liste des Studios
                <button id="addStudioBtn" class="btn-add">
                    <i class="fas fa-plus"></i> Ajouter
                </button>
            </h2>

            <table class="table">
                <thead>
                    <tr>
                        <th></th>
                        <th>Nom</th>
                        <th>Localisation</th>
                        <th>Fondé le</th>
                        <th>Fondateur</th>
                        <th>Employés</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studioListe">
                    <!-- Contenu généré par JS -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal pour ajouter un studio -->
    <div id="addStudioModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2><i class="fas fa-plus"></i> Ajouter un studio</h2>
            <form id="addStudioForm">
                <label for="name">Nom :</label>
                <input type="text" id="name" name="name" required>

                <label for="location">Localisation :</label>
                <input type="text" id="location" name="location" required>

                <label for="founded">Fondé le :</label>
                <input type="date" id="founded" name="founded" required>

                <label for="founder">Fondateur :</label>
                <input type="text" id="founder" name="founder" required>

                <label for="employees">Employés :</label>
                <input type="number" id="employees" name="employees" required>

                <label for="imageUrl">URL de l'image :</label>
                <input type="text" id="imageUrl" name="imageUrl" placeholder="https://exemple.com/image.jpg">

                <button type="submit"><i class="fas fa-save"></i> Ajouter</button>
            </form>
        </div>
    </div>

    <!-- Modal pour modifier un studio -->
    <div id="editStudioModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2><i class="fas fa-edit"></i> Modifier un studio</h2>
            <form id="editStudioForm">
                <input type="hidden" id="editId" name="id">

                <label for="editName">Nom :</label>
                <input type="text" id="editName" name="name" required>

                <label for="editLocation">Localisation :</label>
                <input type="text" id="editLocation" name="location" required>

                <label for="editFounded">Fondé le :</label>
                <input type="date" id="editFounded" name="founded" required>

                <label for="editFounder">Fondateur :</label>
                <input type="text" id="editFounder" name="founder" required>

                <label for="editEmployees">Employés :</label>
                <input type="number" id="editEmployees" name="employees" required>

                <label for="editImageUrl">URL de l'image :</label>
                <input type="text" id="editImageUrl" name="imageUrl" placeholder="https://exemple.com/image.jpg">

                <button type="submit"><i class="fas fa-save"></i> Enregistrer</button>
            </form>
        </div>
    </div>

    <!-- Modal pour supprimer un studio -->
    <div id="deleteStudioModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2><i class="fas fa-exclamation-triangle"></i> Supprimer un studio</h2>
            <p>Êtes-vous sûr de vouloir supprimer ce studio ?</p>
            <button type="button" id="confirmDeleteBtn"><i class="fas fa-trash"></i> Supprimer</button>
            <button type="button" id="cancelDeleteBtn"><i class="fas fa-ban"></i> Annuler</button>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <!-- Script -->
    <script type="module" src="/assets/scripts/studioListe.js"></script>
</body>
</html>
