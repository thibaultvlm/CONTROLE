<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/style.root.css">
    <link rel="stylesheet" href="../assets/css/style.header.css">
    <link rel="stylesheet" href="../assets/css/style.form.css">
    <title>Liste des Studios</title>
</head>
<body>
    <header>
        <h1>Bienvenue,</h1>
        <ul>
            <li><a href="/">Accueil</a></li>
            <li><a href="/public/listegame.html">Liste des jeux</a></li>
            <li><a href="/public/listestudio.html">Listes des studios</a></li>
        </ul>
    </header>   
    <div id="liste">
        <h2>Liste des Studios</h2>
        <button id="addStudios" class="btn-add">Ajouter un Studio</button>
    </div>
    <div class="row">
        <div class="col-offset">
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Nom</th>
                        <th scope="col">Localistation</th>
                        <th scope="col">Date de Creation</th>
                        <th scope="col">Fondateur</th>
                        <th scope="col">Employées</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody class="studioListe">

                </tbody>
            </table>
        </div>
    </div>

    <div id="addStudioModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Ajouter un Studio</h2>
            <form id="addStudioForm">
                <label for="name">Nom :</label>
                <input type="text" name="name" id="name" required>
                <label for="location">Localistation :</label>
                <input type="text" name="locaiton" id="location" required>
                <label for="createDate">Date de Création :</label>
                <input type="text" name="createDate" id="createDate" required>
                <label for="fonder">Fondateur :</label>
                <input type="text" name="fonder" id="fonder" required>
                <label for="employee">Employées :</label>
                <input type="number" name="employee" id="employee" required>
                <button type="submit">Ajouter</button>
            </form>
        </div>
    </div>

    <div id="editStudioModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Modifier un Studio</h2>
            <form id="editStudioForm">
                <label for="name">Nom :</label>
                <input type="text" name="name" id="name" required>
                <label for="location">Localistation :</label>
                <input type="text" name="locaiton" id="location" required>
                <label for="createDate">Date de Création :</label>
                <input type="text" name="createDate" id="createDate" required>
                <label for="fonder">Fondateur :</label>
                <input type="text" name="fonder" id="fonder" required>
                <label for="employee">Employées :</label>
                <input type="number" name="employee" id="employee" required>
                <button type="submit">Modifier</button>
            </form>
        </div>
    </div>

    <div id="deleteStudioModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Supprimer un Studio</h2>
            <p>Êtes-vous sûr de voulour supprimer ce studio ?</p>
            <button id="confirmDeleteBtn">Supprimer</button>
            <button id="cancelDeleteBtn">Annuler</button>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script type="module" src="./assets/scripts/studioListe.js"></script>
</body>
</html>
